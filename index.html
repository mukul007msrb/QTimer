<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2307070a'/%3E%3Ccircle cx='256' cy='282' r='120' fill='none' stroke='%23eef2f5' stroke-width='30'/%3E%3Crect x='228' y='86' width='56' height='40' rx='12' fill='%23eef2f5'/%3E%3Cpath d='M256 282 L312 218' stroke='%235df0b4' stroke-width='30' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Tempo</title>
<style>
  :root {
    --bg: #07070a;
    --ink: #eef2f5;
    --dim: #7d838c;
    --line: #23262c;
    --good: #5df0b4;
    --bad: #ff7a4d;
    --gold: #ffd24a;
    --accent: var(--ink);
    --panel: #17191d;
    --panel2: #23262c;
    --border: #3a3f47;
    --sheet: rgba(7, 7, 10, .97);
    --chartbg: #0d0f12;
    --bar: #4a505a;
    --soft: #c4c9d0;
    --glow: 0 0 60px color-mix(in srgb, var(--accent) 18%, transparent);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f5f5f2;
    --ink: #17191c;
    --dim: #6a7078;
    --line: #dedfd9;
    --good: #0c9a69;
    --bad: #d4521b;
    --gold: #a87400;
    --panel: #e8e8e3;
    --panel2: #dcdcd6;
    --border: #c3c4bd;
    --sheet: rgba(245, 245, 242, .98);
    --chartbg: #ebebe6;
    --bar: #a5aab1;
    --soft: #3a3f46;
    --glow: none;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Display", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .digits {
    grid-area: 1 / 1;
    font-size: min(30vw, 52vh);
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-shadow: var(--glow);
    pointer-events: none;
  }
  .digits.long { font-size: min(22vw, 44vh); }
  .digits.float { font-size: min(19vw, 27vh); }
  .digits.float.long { font-size: min(14vw, 22vh); }
  .ring {
    position: fixed; left: 50%; top: 50%;
    width: 30vmin; height: 30vmin;
    border: 4px solid #fff; border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0);
  }
  .float { z-index: 2; will-change: transform, opacity, filter; }
  .float.good { color: var(--good); text-shadow: 0 0 70px rgba(93, 240, 180, .45); }
  .float.bad  { color: var(--bad);  text-shadow: 0 0 70px rgba(255, 122, 77, .45); }
  body.paused #time { color: var(--dim); text-shadow: none; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }

  .corner {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    font-size: 22px; font-weight: 700; color: var(--dim);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #q { left: calc(env(safe-area-inset-left, 0px) + 22px); }
  #total { right: calc(env(safe-area-inset-right, 0px) + 22px); }

  #bar {
    position: fixed;
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #hint { flex: 1; text-align: center; font-size: 16px; color: var(--dim); white-space: pre-line; pointer-events: none; }
  #barL, #barR { min-width: 84px; display: flex; }
  #barR { justify-content: flex-end; }
  .link {
    appearance: none; background: none; border: 0; font: inherit;
    font-size: 17px; font-weight: 700; color: var(--dim);
    padding: 14px 10px; white-space: nowrap; cursor: pointer;
  }
  .link:active { color: var(--ink); }

  #badge {
    position: fixed; left: 0; right: 0; bottom: 14vh;
    text-align: center; font-size: 26px; font-weight: 800; color: var(--gold);
    text-shadow: 0 0 30px rgba(255, 210, 74, .5);
    pointer-events: none; opacity: 0;
  }
  @media (orientation: landscape) { #badge { bottom: 3vh; font-size: 22px; } }

  #flash {
    position: fixed; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, var(--c, #fff) 0%, transparent 72%);
  }
  #hold { position: fixed; left: 0; bottom: 0; height: 4px; width: 0; background: var(--bad); pointer-events: none; }
  #hold.go { width: 100%; transition: width 1.2s linear; }

  /* Sheets: settings, summary, sessions */
  #sheet {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: var(--sheet);
    overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-right, 0px) + 24px)
             calc(env(safe-area-inset-bottom, 0px) + 24px) calc(env(safe-area-inset-left, 0px) + 24px);
  }
  #sheet.open { display: block; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
  .sub { font-size: 17px; color: var(--dim); margin-bottom: 22px; min-height: 1.2em; }
  .sub.good { color: var(--good); font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 16px; margin-bottom: 28px; }
  .stat span { display: block; font-size: 15px; color: var(--dim); margin-bottom: 2px; }
  .stat b { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat.f b { color: var(--good); }
  .stat.s b { color: var(--bad); }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    appearance: none; font: inherit; font-size: 18px; font-weight: 700; color: var(--ink);
    background: transparent; border: 1.5px solid var(--border); border-radius: 999px;
    padding: 14px 24px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .btn:active { opacity: .7; }
  .set { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .set label { font-size: 19px; font-weight: 600; }
  .set label small { display: block; font-size: 14px; color: var(--dim); font-weight: 400; margin-top: 2px; }
  .step { display: flex; align-items: center; gap: 6px; }
  .step button {
    appearance: none; font: inherit; font-size: 26px; font-weight: 700; color: var(--ink);
    width: 48px; height: 48px; border-radius: 50%; background: var(--panel); border: 0; cursor: pointer;
  }
  .step button:active { background: var(--panel2); }
  .step output { min-width: 64px; text-align: center; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .srow { display: flex; justify-content: space-between; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .srow i { font-style: normal; color: var(--dim); font-size: 15px; }
  .srow b { font-size: 19px; font-weight: 700; }
  .srow em { font-style: normal; color: var(--good); font-weight: 700; }

  /* settings controls, times list */
  input { -webkit-user-select: text; user-select: text; }
  .set { display: block; align-items: initial; padding: 20px 0; }
  .set label { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 12px; }
  .chip {
    appearance: none; font: inherit; font-size: 17px; font-weight: 700; color: var(--ink);
    background: var(--panel); border: 1.5px solid transparent; border-radius: 999px;
    padding: 10px 18px; cursor: pointer;
  }
  .chip.on { border-color: var(--accent); }
  .custom { display: flex; align-items: center; gap: 8px; }
  .custom input {
    width: 84px; font: inherit; font-size: 24px; font-weight: 800; text-align: center;
    color: var(--ink); background: var(--panel); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 10px 6px; font-variant-numeric: tabular-nums;
  }
  .custom span { color: var(--dim); font-size: 17px; margin-right: 8px; }
  button.srow {
    appearance: none; background: none; border: 0; border-bottom: 1px solid var(--line);
    width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  button.srow:active { background: var(--panel); }
  h2 { font-size: 19px; font-weight: 800; margin: 30px 0 4px; }
  h2 small { display: block; font-size: 14px; font-weight: 400; color: var(--dim); margin-top: 2px; }
  .trow {
    display: grid; grid-template-columns: 58px 1fr auto; align-items: baseline;
    padding: 12px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .trow i { font-style: normal; color: var(--dim); font-size: 16px; }
  .trow b { font-size: 24px; font-weight: 800; }
  .trow u { text-decoration: none; font-size: 13px; color: var(--dim); margin-left: 6px; }
  .trow em { font-style: normal; color: var(--dim); font-size: 15px; }
  .trow.f b { color: var(--good); }
  .trow.s b { color: var(--bad); }

  #pace { top: calc(env(safe-area-inset-top, 0px) + 48px); right: calc(env(safe-area-inset-right, 0px) + 22px); font-size: 17px; }
  #pace.good { color: var(--good); }
  #pace.bad { color: var(--bad); }
  .chart { background: var(--chartbg); border-radius: 16px; padding: 14px 14px 12px; margin: 0 0 22px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart polyline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .chart circle { fill: var(--accent); }
  .chart circle.best { fill: var(--good); }
  .chart text { fill: var(--dim); font-size: 12px; font-family: inherit; }
  .chartcap { font-size: 14px; color: var(--dim); margin-top: 6px; }
  .chart rect { fill: var(--bar); }
  .chart rect.best { fill: var(--good); }
  .chart rect.worst { fill: var(--bad); }
  .chart line.tgt { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .about p { font-size: 17px; line-height: 1.5; color: var(--soft); margin: 8px 0; }
  .about ul { margin: 8px 0; padding-left: 22px; }
  .about li { font-size: 17px; line-height: 1.5; color: var(--soft); margin: 7px 0; padding-left: 2px; }
  .about li::marker { color: var(--dim); }
  .about b { color: var(--ink); }
  .about h2 { margin-top: 26px; }

  /* computers: mouse and keyboard */
  @media (hover: hover) and (pointer: fine) {
    body { cursor: pointer; }
    .corner { font-size: clamp(22px, 2vw, 32px); }
    #pace { font-size: clamp(17px, 1.5vw, 24px); }
    #hint { font-size: clamp(16px, 1.3vw, 20px); }
    .link { font-size: clamp(17px, 1.4vw, 21px); }
    .link:hover, .btn:hover, .chip:hover { color: var(--ink); }
    .btn:hover:not(.primary), .chip:hover { border-color: var(--dim); }
    .wrap { max-width: 640px; }
  }

  /* launch menu */
  .wrap.menu { min-height: calc(100vh - 48px); display: flex; flex-direction: column; justify-content: center; max-width: 420px; text-align: center; }
  .logo svg { width: 84px; height: 84px; margin-bottom: 14px; }
  .mtitle { font-size: 48px; letter-spacing: -0.02em; margin: 0; }
  .msub { margin-bottom: 28px; }
  .mbtn {
    appearance: none; font: inherit; font-size: 20px; font-weight: 700; color: var(--ink);
    background: var(--panel); border: 0; border-radius: 18px; padding: 18px; margin-bottom: 12px;
    width: 100%; cursor: pointer;
  }
  .mbtn.primary { background: var(--accent); color: var(--bg); padding: 22px; font-size: 22px; }
  .mbtn:active { opacity: .75; }
  .mbtn:hover:not(.primary) { background: var(--panel2); }
  .mnote { color: var(--dim); font-size: 15px; line-height: 1.6; margin-top: 12px; }
  @media (max-height: 520px) {
    .logo { display: none; }
    .mtitle { font-size: 34px; }
    .msub { margin-bottom: 14px; }
    .mbtn { padding: 12px; margin-bottom: 8px; font-size: 18px; }
    .mbtn.primary { padding: 14px; font-size: 19px; }
  }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; border: 1px solid var(--border); }
</style>
</head>
<body>
<div id="stage"><div id="time" class="digits">0.00</div></div>
<div id="flash"></div>
<div id="badge">New fastest</div>
<div id="q" class="corner">Question 1</div>
<div id="total" class="corner">0:00</div>
<div id="pace" class="corner"></div>
<div id="bar"><div id="barL"></div><div id="hint">Tap to start</div><div id="barR"></div></div>
<div id="hold"></div>
<div id="sheet"></div>

<script>
(function () {
  var status = 'idle';          // idle | running | paused | done
  var segStart = 0, acc = 0;
  var times = [], sum = 0, count = 0;
  var lastRecord = null, lockUntil = 0, saved = false;
  var DOUBLE_MS = 300;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var $ = function (id) { return document.getElementById(id); };
  var elTime = $('time'), elQ = $('q'), elTotal = $('total'), elHint = $('hint');
  var elStage = $('stage'), elFlash = $('flash'), elHold = $('hold'), elSheet = $('sheet');
  var elBarL = $('barL'), elBarR = $('barR'), elPace = $('pace');
  var wake = null, clearArmed = false;

  // ---------- storage (safe if blocked) ----------
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var settings = load('qt-settings', { target: 0, n: 0 });
  var sessions = load('qt-sessions', []);
  settings.minutes = settings.minutes || 0;
  settings.theme = settings.theme || 'dark';
  settings.accent = settings.accent || 'classic';
  var endedByTime = false;

  // ---------- look: theme and accent ----------
  var ACCENT_LIST = [['classic', 'Classic', 'var(--ink)'], ['sky', 'Sky', '#6cb8ff'], ['violet', 'Violet', '#b79cff'], ['rose', 'Rose', '#ff8fb0'], ['amber', 'Amber', '#ffc24a']];
  var ACCENTS = { sky: ['#6cb8ff', '#1767c2'], violet: ['#b79cff', '#6a3fd1'], rose: ['#ff8fb0', '#c42a5e'], amber: ['#ffc24a', '#a86400'] };
  var mqLight = window.matchMedia('(prefers-color-scheme: light)');
  function isLight() { return settings.theme === 'light' || (settings.theme === 'auto' && mqLight.matches); }
  function cv(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function applyLook() {
    var de = document.documentElement, light = isLight();
    de.setAttribute('data-theme', light ? 'light' : 'dark');
    var a = ACCENTS[settings.accent];
    if (a) de.style.setProperty('--accent', a[light ? 1 : 0]); else de.style.removeProperty('--accent');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', light ? '#f5f5f2' : '#07070a');
  }
  if (mqLight.addEventListener) mqLight.addEventListener('change', applyLook);
  applyLook();

  // ---------- formatting ----------
  function fmt(ms) {
    var s = ms / 1000;
    if (s < 60) return s.toFixed(2);
    var m = Math.floor(s / 60), r = s - m * 60;
    return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
  }
  function fmtTotal(ms) {
    var t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function fmtTarget(sec) {
    if (sec < 60) return sec + 's';
    var m = Math.floor(sec / 60), r = sec % 60;
    return m + 'm' + (r ? ' ' + r + 's' : '');
  }
  function fmtDelta(ms) { return ms < 60000 ? (ms / 1000).toFixed(1) + 's' : fmtTotal(ms); }
  function current() { return acc + (status === 'running' ? performance.now() - segStart : 0); }

  // ---------- main loop / render ----------
  function tick() {
    if (status === 'counting') return;
    var c = current(), txt = fmt(c);
    elTime.textContent = txt;
    elTime.classList.toggle('long', txt.length > 5);
    if (settings.minutes) {
      var rem = settings.minutes * 60000 - (sum + c);
      if (status === 'running' && rem <= 0) { endTimed(); return; }
      elTotal.textContent = fmtTotal(Math.ceil(Math.max(0, rem) / 1000) * 1000) + ' left';
    } else {
      elTotal.textContent = fmtTotal(sum + c);
    }
    if (status === 'running') requestAnimationFrame(tick);
  }
  function cfgLine() {
    var p = [];
    if (settings.target) p.push('Target ' + fmtTarget(settings.target));
    if (settings.n) p.push(settings.n + ' questions');
    if (settings.minutes) p.push(settings.minutes + ' min');
    if (settings.countdown) p.push('3-2-1 start');
    return p.join(' · ');
  }
  function render() {
    document.body.classList.toggle('paused', status === 'paused');
    elQ.textContent = status === 'done' ? 'Done' :
      'Question ' + (count + 1) + (settings.n ? ' / ' + settings.n : '');
    var hint = '', L = '', R = '', desk = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (status === 'idle') {
      hint = (desk ? 'Click or press Space to start' : 'Tap to start') + (cfgLine() ? '\n' + cfgLine() : '') +
             (desk ? '\nM menu · S settings · H sessions · F full screen' : '');
      L = '<button class="link" data-act="menu">Menu</button>';
    } else if (status === 'paused') {
      hint = desk ? 'Paused\nSpace or click to resume · E finish · hold or press R twice to reset' : 'Paused\ntap to resume · hold to reset';
      L = '<button class="link" data-act="finish">Finish</button>';
    }
    elHint.textContent = hint; elBarL.innerHTML = L; elBarR.innerHTML = R;
    var pc = '', pcls = '';
    if (settings.target && count >= 1 && (status === 'running' || status === 'paused')) {
      var delta = settings.target * 1000 * count - sum;
      if (Math.abs(delta) < 50) pc = 'on pace';
      else { pc = fmtDelta(Math.abs(delta)) + (delta > 0 ? ' ahead' : ' behind'); pcls = delta > 0 ? 'good' : 'bad'; }
    }
    elPace.textContent = pc; elPace.className = 'corner' + (pcls ? ' ' + pcls : '');
    tick();
  }

  function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wake) {
        navigator.wakeLock.request('screen').then(function (w) {
          wake = w; w.addEventListener('release', function () { wake = null; });
        }).catch(function () {});
      }
    } catch (e) {}
  }
  function release() { try { if (wake) { wake.release(); wake = null; } } catch (e) {} }

  // ---------- feedback animation ----------
  function feedback(t, prevAvg, isBest) {
    var cls = '', color = cv('--ink');
    if (settings.target) {
      if (t <= settings.target * 1000) { cls = 'good'; color = cv('--good'); }
      else { cls = 'bad'; color = cv('--bad'); }
    } else if (prevAvg !== null) {
      if (t < prevAvg * 0.95) { cls = 'good'; color = cv('--good'); }
      else if (t > prevAvg * 1.05) { cls = 'bad'; color = cv('--bad'); }
    }
    if (isBest) color = cv('--gold');

    var f = document.createElement('div');
    f.className = 'digits float ' + cls;
    f.textContent = fmt(t);
    if (fmt(t).length > 5) f.classList.add('long');
    elStage.appendChild(f);
    var F = parseFloat(getComputedStyle(elTime).fontSize) || 100;
    var F2 = parseFloat(getComputedStyle(f).fontSize) || 60;
    var s0 = F / F2, off = -(0.42 * F + 0.55 * F2);
    var a = f.animate(reduce
      ? [{ opacity: 1, transform: 'translateY(' + off + 'px)' }, { opacity: 0, transform: 'translateY(' + off + 'px)' }]
      : [
          { opacity: 1, transform: 'translateY(0px) scale(' + s0 + ')', filter: 'blur(0px)', offset: 0 },
          { opacity: 1, transform: 'translateY(0px) scale(' + (s0 * 1.05) + ')', filter: 'blur(0px)', offset: 0.08, easing: 'cubic-bezier(.2,.9,.3,1)' },
          { opacity: 1, transform: 'translateY(' + off + 'px) scale(1)', filter: 'blur(0px)', offset: 0.26 },
          { opacity: 1, transform: 'translateY(' + (off - 8) + 'px) scale(1)', filter: 'blur(0px)', offset: 0.72 },
          { opacity: 0, transform: 'translateY(' + (off - 70) + 'px) scale(.85)', filter: 'blur(10px)', offset: 1 }
        ],
      { duration: reduce ? 1200 : 3200, easing: 'linear', fill: 'forwards' });
    a.onfinish = function () { f.remove(); };

    elFlash.style.setProperty('--c', color);
    elFlash.animate([{ opacity: reduce ? 0 : (isBest ? 0.7 : 0.55) }, { opacity: 0 }], { duration: 900, easing: 'ease-out' });
    if (!reduce) {
      var rings = isBest ? 2 : 1;
      for (var i = 0; i < rings; i++) (function (delay) {
        var ring = document.createElement('div');
        ring.className = 'ring';
        ring.style.borderColor = color;
        document.body.appendChild(ring);
        var r = ring.animate([
          { transform: 'translate(-50%, -50%) scale(0.2)', opacity: 0.9 },
          { transform: 'translate(-50%, -50%) scale(8)', opacity: 0 }
        ], { duration: 1100, delay: delay, easing: 'cubic-bezier(.1,.6,.3,1)', fill: 'backwards' });
        r.onfinish = function () { ring.remove(); };
      })(i * 160);
      elStage.animate([
        { transform: 'translate(0, 0)' }, { transform: 'translate(-10px, 6px)' },
        { transform: 'translate(9px, -7px)' }, { transform: 'translate(-5px, 4px)' },
        { transform: 'translate(0, 0)' }
      ], { duration: 340, easing: 'ease-out' });
    }
    if (!reduce) elTime.animate(
      [{ transform: 'scale(.7)', opacity: 0.3 }, { transform: 'scale(1)', opacity: 1 }],
      { duration: 380, easing: 'cubic-bezier(.2,1.3,.4,1)' });

    var badge = null;

      badge.animate([
        { opacity: 0, transform: 'scale(.7)' },
        { opacity: 1, transform: 'scale(1.08)', offset: 0.1 },
        { opacity: 1, transform: 'scale(1)', offset: 0.7 },
        { opacity: 0, transform: 'scale(1)' }
      ], { duration: reduce ? 1200 : 3000 });
    }
    return { el: f, badge: badge };
  }

  // ---------- core actions ----------
  function onTap() {
    var now = performance.now();
    if (status === 'idle') {
      if (settings.countdown) { startCountdown(); return; }
      status = 'running'; acc = 0; segStart = now; lockUntil = now + DOUBLE_MS; lastRecord = null;
      keepAwake();
    } else if (status === 'running') {
      if (now < lockUntil) return;
      if (lastRecord && now - lastRecord.at < DOUBLE_MS) {
        // double tap: undo the record, carry on that question, pause
        sum -= lastRecord.t; count--; times.pop();
        if (lastRecord.el) lastRecord.el.remove();
        if (lastRecord.badge) lastRecord.badge.getAnimations().forEach(function (an) { an.cancel(); });
        acc = lastRecord.t + (now - lastRecord.at);
        lastRecord = null;
        status = 'paused'; release();
      } else {
        var t = acc + now - segStart;
        var prevAvg = count ? sum / count : null;
        var isBest = count >= 1 && t < Math.min.apply(null, times);
        var fb = feedback(t, prevAvg, isBest);
        sum += t; count++; times.push(t);
        acc = 0; segStart = now;
        lastRecord = { t: t, at: now, el: fb.el, badge: fb.badge };
        if (settings.n && count >= settings.n) {
          status = 'done'; release(); lastRecord = null;
          render();
          setTimeout(function () { if (status === 'done') showSummary(); }, reduce ? 1400 : 3000);
          return;
        }
      }
    }
    render();
  }
  function startCountdown() {
    status = 'counting'; acc = 0; lastRecord = null; keepAwake();
    render();
    var n = 3;
    function step() {
      if (status !== 'counting') return;
      if (n === 0) {
        var now = performance.now();
        status = 'running'; segStart = now; lockUntil = now + DOUBLE_MS;
        elFlash.style.setProperty('--c', cv('--ink'));
        if (!reduce) elFlash.animate([{ opacity: 0.3 }, { opacity: 0 }], { duration: 600, easing: 'ease-out' });
        render();
        return;
      }
      elTime.textContent = n; elTime.classList.remove('long');
      elTime.animate(reduce
        ? [{ opacity: 0.2 }, { opacity: 1 }]
        : [{ transform: 'scale(1.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1, offset: 0.25 }, { transform: 'scale(.9)', opacity: 0.3 }],
        { duration: 950, easing: 'ease-out' });
      n--; setTimeout(step, 1000);
    }
    step();
  }
  function endTimed() {
    if (status !== 'running') return;
    status = 'done'; endedByTime = true; acc = 0; lastRecord = null; release();
    render();
    var b = $('badge'); b.textContent = 'Time’s up';
    b.animate([{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'scale(1.08)', offset: 0.15 }, { opacity: 1, transform: 'scale(1)', offset: 0.85 }, { opacity: 1 }],
      { duration: reduce ? 1200 : 1800, fill: 'forwards' });
    elFlash.style.setProperty('--c', cv('--ink'));
    if (!reduce) elFlash.animate([{ opacity: 0.45 }, { opacity: 0 }], { duration: 900, easing: 'ease-out' });
    setTimeout(function () { b.getAnimations().forEach(function (an) { an.cancel(); }); if (status === 'done') showSummary(); }, reduce ? 1200 : 1800);
  }
  function resume() {
    var now = performance.now();
    status = 'running'; segStart = now; lockUntil = now + DOUBLE_MS; lastRecord = null;
    keepAwake(); render();
  }
  function resetAll() {
    status = 'idle'; acc = 0; sum = 0; count = 0; times = []; lastRecord = null; saved = false; endedByTime = false; release();
    render();
  }
  function finish() {
    if (!count) { resetAll(); return; }
    status = 'done'; release(); render(); showSummary();
  }

  function syncSettingsUI() {
    var cs = elSheet.querySelectorAll('.chip');
    for (var i = 0; i < cs.length; i++) {
      var act = cs[i].getAttribute('data-act'), raw = cs[i].getAttribute('data-v'), on = false;
      if (act === 'tpreset') on = +raw === settings.target;
      else if (act === 'npreset') on = +raw === settings.n;
      else if (act === 'lpreset') on = +raw === settings.minutes;
      else if (act === 'cdpreset') on = (raw === '1') === !!settings.countdown;
      else if (act === 'thpreset') on = raw === settings.theme;
      else if (act === 'acpreset') on = raw === settings.accent;

    }

    if (tm) tm.value = Math.floor(settings.target / 60);

  function statsHTML(s) {
    var hasHits = s.hits !== null && s.hits !== undefined;
    return '<div class="grid">' +
      '<div class="stat"><span>Questions</span><b>' + s.n + '</b></div>' +
      '<div class="stat"><span>Total time</span><b>' + fmtTotal(s.total) + '</b></div>' +
      '<div class="stat"><span>Average</span><b>' + fmt(s.avg) + '</b></div>' +

      '<div class="stat f"><span>Fastest</span><b>' + fmt(s.min) + '</b></div>' +
      '<div class="stat s"><span>Slowest</span><b>' + fmt(s.max) + '</b></div>' +
      '</div>';
  }
  function questionChartHTML(ts, tgt) {
    if (!ts || ts.length < 2) return '';
    var W = 320, H = 140, pl = 10, pr = 10, pt = 22, pb = 22;
    var mn = Math.min.apply(null, ts), mx = Math.max.apply(null, ts);
    var top = Math.max(mx, tgt ? tgt * 1000 : 0) * 1.08;
    var n = ts.length, slot = (W - pl - pr) / n, bw = Math.min(28, slot * 0.7);
    var bars = ts.map(function (v, i) {
      var h = (H - pt - pb) * v / top, x = pl + slot * i + (slot - bw) / 2, y = H - pb - h;
      var cls = mn === mx ? '' : v === mn ? ' class="best"' : v === mx ? ' class="worst"' : '';
      return '<rect' + cls + ' x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="' + Math.min(3, bw / 2).toFixed(1) + '"/>';
    }).join('');
    var tl = '';
    if (tgt) {
      var ty = H - pb - (H - pt - pb) * tgt * 1000 / top;
      tl = '<line class="tgt" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + ty.toFixed(1) + '" y2="' + ty.toFixed(1) + '"/>' +
           '<text x="' + (W - pr) + '" y="' + (ty - 5).toFixed(1) + '" text-anchor="end">target ' + fmtTarget(tgt) + '</text>';
    }
    return '<div class="chart" style="margin-top:26px"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Time per question">' +
      bars + tl + '<text x="' + pl + '" y="' + (H - 6) + '">Q1</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">Q' + n + '</text>' +
      '</svg><div class="chartcap">Time per question, in order. Green is fastest, orange is slowest.</div></div>';
  }
  function listHTML(ts, tgt) {
    if (!ts || !ts.length) return '<div class="sub" style="margin-top:20px">Individual times were not saved for this session.</div>';
    var mn = Math.min.apply(null, ts), mx = Math.max.apply(null, ts), cum = 0, rows = '';
    for (var i = 0; i < ts.length; i++) {
      cum += ts[i];
      var cls = ts.length > 1 ? (ts[i] === mn ? ' f' : ts[i] === mx ? ' s' : '') : '';
      var tag = cls === ' f' ? ' <u>fastest</u>' : cls === ' s' ? ' <u>slowest</u>' : '';
      rows += '<div class="trow' + cls + '"><i>Q' + (i + 1) + '</i><span><b>' + fmt(ts[i]) + '</b>' + tag + '</span><em>' + fmtTotal(cum) + '</em></div>';
    }

  }

  function showSummary() {
    if (!count) { closeSheet(); resetAll(); return; }
    var avg = sum / count, mn = Math.min.apply(null, times), mx = Math.max.apply(null, times);
    var hits = settings.target ? times.filter(function (x) { return x <= settings.target * 1000; }).length : null;
    var priorBest = null;
    sessions.forEach(function (x) { if (x.n >= 3 && (priorBest === null || x.avg < priorBest)) priorBest = x.avg; });
    var note = '', good = false;
    if (count >= 3 && priorBest !== null && !saved) {
      if (avg < priorBest) { note = 'Best average yet'; good = true; }
      else note = '+' + ((avg - priorBest) / 1000).toFixed(2) + 's vs your best average';
    }
    if (endedByTime) note = 'Time’s up' + (note ? ' · ' + note : '');
    var rec = { d: Date.now(), n: count, total: sum, avg: avg, min: mn, max: mx, tgt: settings.target, lim: settings.minutes, hits: hits,
                times: times.map(function (x) { return Math.round(x); }) };
    if (!saved) {
      sessions.unshift(rec); sessions = sessions.slice(0, 60); store('qt-sessions', sessions); saved = true;
    }
    openSheet(
      '<h1>Session complete</h1><div class="sub' + (good ? ' good' : '') + '">' + (note || '&nbsp;') + '</div>' +

  function chartHTML() {

    var W = 320, H = 130, pl = 10, pr = 10, pt = 24, pb = 14;
    var mn = Math.min.apply(null, d), mx = Math.max.apply(null, d);
    if (mx - mn < 1000) { mx += 500; mn = Math.max(0, mn - 500); }
    var lab = function (ms) { return ms < 60000 ? (ms / 1000).toFixed(1) + 's' : fmtTotal(ms); };
    var pts = d.map(function (v, i) {

      '<text x="' + pl + '" y="14">' + lab(mx) + '</text><text x="' + pl + '" y="' + (H - 1) + '">' + lab(mn) + '</text>' +
      '<polyline points="' + pts.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '"/>' + dots +

  }

      '<h1>Sessions</h1><div class="sub">' + (sessions.length ? 'Tap a session to see every time' : 'Finish a session and it will appear here') + '</div>' +
      chartHTML() + rows +
      '<div class="btns" style="margin-top:26px"><button class="btn primary" data-act="close">Close</button>' +
      (sessions.length ? '<button class="btn" data-act="clear">' + (clearArmed ? 'Tap again to clear' : 'Clear all') + '</button>' : '') + '</div>');
  }

  elSheet.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'tpreset') { settings.target = +b.getAttribute('data-v'); store('qt-settings', settings); syncSettingsUI(); }
    else if (a === 'lpreset') { settings.minutes = +b.getAttribute('data-v'); store('qt-settings', settings); syncSettingsUI(); }
    else if (a === 'thpreset') { settings.theme = b.getAttribute('data-v'); store('qt-settings', settings); applyLook(); syncSettingsUI(); }
    else if (a === 'acpreset') { settings.accent = b.getAttribute('data-v'); store('qt-settings', settings); applyLook(); syncSettingsUI(); }
    else if (a === 'cdpreset') { settings.countdown = b.getAttribute('data-v') === '1'; store('qt-settings', settings); syncSettingsUI(); }
    else if (a === 'npreset') { settings.n = +b.getAttribute('data-v'); store('qt-settings', settings); syncSettingsUI(); }
    else if (a === 'about') showAbout();
    else if (a === 'settings-back') showMenu();
    else if (a === 'install') { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; showAbout(); } }
    else if (a === 'start') { closeSheet(); render(); }
    else if (a === 'go-settings') showSettings();
    else if (a === 'go-sessions') showSessions();
    else if (a === 'go-about') showAbout();
    else if (a === 'menu-new') { resetAll(); showMenu(); }
    else if (a === 'close') showMenu();
    else if (a === 'new') { closeSheet(); resetAll(); }
    else if (a === 'sessions-new') { resetAll(); showSessions(); }
    else if (a === 'sessions') showSessions();
    else if (a === 'open') showDetail(+b.getAttribute('data-i'));
    else if (a === 'clear') {
      if (!clearArmed) { clearArmed = true; showSessions(); }
      else { sessions = []; store('qt-sessions', sessions); clearArmed = false; showSessions(); }
    }
  });
  elSheet.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'tmin' || id === 'tsec') {
      var m = parseInt($('tmin').value, 10) || 0, sec = parseInt($('tsec').value, 10) || 0;
      settings.target = Math.max(0, Math.min(7200, m * 60 + sec));
    } else if (id === 'lin') {
      settings.minutes = Math.max(0, Math.min(480, parseInt(e.target.value, 10) || 0));
    } else if (id === 'nin') {
      settings.n = Math.max(0, Math.min(500, parseInt(e.target.value, 10) || 0));
    } else return;
    store('qt-settings', settings); syncSettingsUI();
  });
  $('bar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'menu') showMenu();
    else if (a === 'settings') showSettings();
    else if (a === 'sessions') showSessions();
    else if (a === 'finish') finish();
  });

  // ---------- input: taps on touch-down; paused press can become hold-to-reset ----------
  var press = null, holdTimer = null;
  function clearHold() {
    clearTimeout(holdTimer);
    elHold.style.transition = 'none';
    elHold.classList.remove('go');
    void elHold.offsetWidth;
    elHold.style.transition = '';
  }
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button') || e.target.closest('#sheet')) return;
    e.preventDefault();
    if (press || status === 'done' || status === 'counting') return;
    if (status === 'paused') {
      press = { paused: true, fired: false };
      elHold.classList.add('go');
      holdTimer = setTimeout(function () { press.fired = true; clearHold(); resetAll(); }, 1200);
    } else {
      press = { paused: false };
      onTap();
    }
  });
  document.addEventListener('pointerup', function () {
    if (!press) return;
    var p = press; press = null;
    if (p.paused && !p.fired) { clearHold(); resume(); }
  });
  document.addEventListener('pointercancel', function () {
    if (press && press.paused) clearHold();
    press = null;
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // ---------- keyboard (desktop) ----------
  var resetKeyTimer = null;
  function pauseNow() {
    if (status !== 'running') return;
    acc = current(); status = 'paused'; lastRecord = null; release(); render();
  }
  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var k = e.key;
    if (elSheet.classList.contains('open')) {
      var isMenu = !!elSheet.querySelector('.wrap.menu');
      if (k === 'Escape') {
        if (isMenu) { closeSheet(); render(); }
        else if (!elSheet.querySelector('[data-act="new"]')) showMenu();
      } else if (isMenu && tag !== 'BUTTON') {
        if (k === 'Enter' || k === ' ') { e.preventDefault(); closeSheet(); render(); }
        else if (k === 's' || k === 'S') showSettings();
        else if (k === 'h' || k === 'H') showSessions();
        else if (k === 'a' || k === 'A') showAbout();
      }
      return;
    }
    if (tag === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
    if (e.repeat) return;
    if (k === ' ' || k === 'Enter') {
      e.preventDefault();
      if (status === 'paused') resume();
      else if (status === 'idle' || status === 'running') onTap();
    } else if (k === 'p' || k === 'P') {
      if (status === 'running') pauseNow(); else if (status === 'paused') resume();
    } else if ((k === 'e' || k === 'E') && status === 'paused') {
      finish();
    } else if ((k === 'r' || k === 'R') && status === 'paused') {
      if (resetKeyTimer) { clearTimeout(resetKeyTimer); resetKeyTimer = null; resetAll(); }
      else {
        elHint.textContent = 'Press R again to reset';
        resetKeyTimer = setTimeout(function () { resetKeyTimer = null; render(); }, 2000);
      }
    } else if ((k === 'm' || k === 'M') && status === 'idle') {
      showMenu();
    } else if ((k === 's' || k === 'S') && status === 'idle') {
      showSettings();
    } else if ((k === 'h' || k === 'H') && status === 'idle') {
      showSessions();
    } else if (k === 'f' || k === 'F') {
      toggleFullscreen();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && status === 'running') { tick(); keepAwake(); }
  });

  // ---------- installable on the home screen (works when served over https) ----------
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });
  window.addEventListener('appinstalled', function () { deferredInstall = null; });
  function makeIcon(size) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var g = c.getContext('2d'), k = size / 512;
    g.fillStyle = '#07070a'; g.fillRect(0, 0, size, size);
    g.strokeStyle = '#eef2f5'; g.lineWidth = 30 * k;
    g.beginPath(); g.arc(256 * k, 282 * k, 120 * k, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#eef2f5'; g.fillRect(228 * k, 86 * k, 56 * k, 40 * k);
    g.strokeStyle = '#5df0b4'; g.lineCap = 'round'; g.lineWidth = 30 * k;
    g.beginPath(); g.moveTo(256 * k, 282 * k); g.lineTo(312 * k, 218 * k); g.stroke();
    return c.toDataURL('image/png');
  }
  function setupPWA() {
    if (!/^https?:$/.test(location.protocol)) return;
    if (document.querySelector('link[rel="manifest"]')) {
      try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
      return;
    }
    try {
      var manifest = {
        name: 'Tempo', short_name: 'Tempo',
        start_url: location.href.split('#')[0], display: 'standalone', orientation: 'any',
        background_color: '#07070a', theme_color: '#07070a',
        icons: [
          { src: makeIcon(192), sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
          { src: makeIcon(512), sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };
      var m = document.createElement('link');
      m.rel = 'manifest';
      m.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      document.head.appendChild(m);
      var a = document.createElement('link');
      a.rel = 'apple-touch-icon'; a.href = makeIcon(180);
      document.head.appendChild(a);
    } catch (e) {}
  }
  setupPWA();

  render();
  showMenu();
})();
</script>
</body>
</html>
